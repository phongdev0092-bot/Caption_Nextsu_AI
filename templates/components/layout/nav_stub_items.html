{# Nav items cho các tab Auto mới — sinh từ STUB_TABS (khai báo trong index.html) #}
{% for t in STUB_TABS %}
<button type="button" class="sidebar-nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-[13.5px] transition-all text-slate-600 hover:bg-slate-100 group relative" id="{{ t.btn_id }}" role="tab" aria-selected="false" data-tab="{{ t.panel_id }}" data-title="{{ t.title }}" title="{{ t.title }}">
  <span class="nav-icon shrink-0 text-[17px] leading-none w-[19px] text-center">{{ t.icon }}</span>
  <span class="nav-label flex-1 text-left font-medium">{{ t.title }}</span>
</button>
{% endfor %}
